databases:
  - name: neohelp-postgres
    databaseName: neohelp
    user: neohelp_admin
    plan: free

services:
  # Redis instance for Outbox deduplication & worker coordination
  - type: redis
    name: neohelp-redis
    plan: free
    ipAllowList: []

  # FastAPI Backend API
  - type: web
    name: neohelp-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neohelp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neohelp-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true

  # Async Outbox Worker
  - type: worker
    name: neohelp-worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m app.worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neohelp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: neohelp-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: neohelp-backend
          envVarKey: SECRET_KEY
      - key: PYTHONPATH
        value: "/app/backend:backend:."

  # React + Vite Frontend (Static Web Service)
  - type: web
    name: neohelp-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neohelp-backend
          property: host
